name: iOS16 Build

on:
  workflow_dispatch:
  push:
    branches: [ios16]

jobs:
  build:
    name: 回移编译
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 选择最新 Xcode
        run: |
          CANDIDATE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "使用 $CANDIDATE"
          sudo xcode-select -s "$CANDIDATE"
          xcodebuild -version

      - name: 编译
        run: |
          set -o pipefail
          xcodebuild build \
            -project WB2API.xcodeproj \
            -scheme WB2API \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            2>&1 | tee /tmp/build.log

      - name: 错误摘要
        if: failure()
        run: rg -n "error:" /tmp/build.log | head -200 || true

      - name: 打包 IPA
        run: |
          set -euo pipefail
          APP=$(find .build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          /usr/libexec/PlistBuddy -c "Set :MinimumOSVersion 16.3" "$APP/Info.plist" || true
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          rm -rf /tmp/ipa/Payload/*.app/_CodeSignature || true
          cd /tmp/ipa && zip -qry WB2API-ios16-unsigned.ipa Payload
          ls -lh WB2API-ios16-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" /tmp/ipa/Payload/*.app/Info.plist

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-ios16
          path: /tmp/ipa/WB2API-ios16-unsigned.ipa
          retention-days: 14

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 14
